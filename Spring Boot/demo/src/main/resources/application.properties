
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:seatsync}?sslMode=${DB_SSL_MODE:DISABLED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
seatsync.jwt.secret=${JWT_SECRET}
seatsync.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
seatsync.admin.email=${SEATSYNC_ADMIN_EMAIL:}
seatsync.admin.password=${SEATSYNC_ADMIN_PASSWORD:}
server.error.include-message=never
seatsync.demo-data.enabled=${DEMO_DATA_ENABLED:true}
seatsync.payment.upi-id=${SEATSYNC_UPI_ID:8885711813@axl}
seatsync.payment.pending-minutes=15
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
seatsync.notifications.email.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
seatsync.notifications.email.from=${EMAIL_FROM:}
seatsync.notifications.sms.enabled=${SMS_NOTIFICATIONS_ENABLED:false}
seatsync.notifications.sms.twilio-account-sid=${TWILIO_ACCOUNT_SID:}
seatsync.notifications.sms.twilio-auth-token=${TWILIO_AUTH_TOKEN:}
seatsync.notifications.sms.twilio-from=${TWILIO_FROM:}